          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Hàng đợi xử lý quá tải
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tải lên ảnh CCCD xử lý bất đồng bộ siêu tốc trong bộ nhớ (< 50ms, Zero-Disk)
      tags:
      - CCCD OCR
