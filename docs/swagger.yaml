basePath: /api/v1
definitions:
  request.AdminCancelPaymentRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      reason:
        minLength: 3
        type: string
    required:
    - evidence_urls
    - reason
    type: object
  request.AdminConfirmPaymentRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      note:
        type: string
    required:
    - evidence_urls
    type: object
  request.AdminConfirmRefundRequestDTO:
    properties:
      bank_ref:
        minLength: 2
        type: string
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      note:
        type: string
    required:
    - bank_ref
    - evidence_urls
    type: object
  request.AdminCreateSuspenseRequestDTO:
    properties:
      admin_note:
        type: string
      amount:
        minimum: 1000
        type: integer
      bank_ref:
        type: string
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      transfer_content:
        type: string
      transfer_time:
        type: string
    required:
    - amount
    - bank_ref
    - evidence_urls
    - transfer_content
    type: object
  request.AdminImportSuspenseItemDTO:
    properties:
      amount:
        minimum: 1000
        type: integer
      bank_ref:
        type: string
      transfer_content:
        type: string
      transfer_time:
        type: string
    required:
    - amount
    - bank_ref
    - transfer_content
    type: object
  request.AdminImportSuspenseRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        type: array
      items:
        items:
          $ref: '#/definitions/request.AdminImportSuspenseItemDTO'
        minItems: 1
        type: array
    required:
    - items
    type: object
  request.AdminListCandidatesRequestDTO:
    properties:
      exam_date:
        type: string
      level:
        maxLength: 100
        type: string
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      search:
        maxLength: 100
        type: string
      status:
        enum:
        - all
        - pending
        - verified
        - rejected
        type: string
    type: object
  request.AdminMarkRefundRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      reason:
        minLength: 3
        type: string
    required:
    - evidence_urls
    - reason
    type: object
  request.AdminMatchSuspenseRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      exam_registration_id:
        minimum: 1
        type: integer
      note:
        type: string
    required:
    - evidence_urls
    - exam_registration_id
    type: object
  request.AdminResolveDoubleChargeRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      keep_payment_id:
        minimum: 1
        type: integer
      note:
        minLength: 3
        type: string
      refund_payment_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - evidence_urls
    - keep_payment_id
    - note
    - refund_payment_ids
    type: object
  request.AdminResolveOverpaymentRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      note:
        minLength: 3
        type: string
      refund_amount:
        minimum: 1000
        type: integer
    required:
    - evidence_urls
    - note
    type: object
  request.AdminTopUpPaymentRequestDTO:
    properties:
      additional_amount:
        minimum: 1000
        type: integer
      cancel_url:
        type: string
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      extend_hours:
        maximum: 168
        minimum: 1
        type: integer
      note:
        type: string
      return_url:
        type: string
    required:
    - evidence_urls
    type: object
  request.AdminUpdateDeliveryRequestDTO:
    properties:
      courier:
        maxLength: 50
        type: string
      tracking_no:
        maxLength: 50
        type: string
    required:
    - courier
    - tracking_no
    type: object
  request.BatchIssueRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
      issue_date:
        description: YYYY-MM-DD
        type: string
    required:
    - exam_session_id
    - issue_date
    type: object
  request.ChangePasswordRequestDTO:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.CreateDeliveryRequestDTO:
    properties:
      address_detail:
        maxLength: 255
        type: string
      courier:
        maxLength: 50
        type: string
      ward_id:
        minimum: 1
        type: integer
    required:
    - address_detail
    type: object
  request.CreatePaymentRequestDTO:
    properties:
      cancel_url:
        type: string
      exam_registration_id:
        minimum: 1
        type: integer
      return_url:
        type: string
    required:
    - cancel_url
    - exam_registration_id
    - return_url
    type: object
  request.CreateProfileRequestDTO:
    properties:
      chinese_study_years:
        minimum: 0
        type: integer
      dob:
        description: YYYY-MM-DD
        type: string
      ethnicity:
        maxLength: 50
        type: string
      full_name:
        maxLength: 150
        type: string
      full_name_cn:
        maxLength: 150
        type: string
      gender:
        enum:
        - male
        - female
        - other
        type: string
      nationality:
        maxLength: 50
        type: string
      religion:
        maxLength: 50
        type: string
    required:
    - dob
    - full_name
    - gender
    type: object
  request.CreateResultRequestDTO:
    properties:
      exam_registration_id:
        minimum: 1
        type: integer
      listening_score:
        maximum: 100
        minimum: 0
        type: number
      reading_score:
        maximum: 100
        minimum: 0
        type: number
      status:
        enum:
        - pass
        - fail
        type: string
      total_score:
        minimum: 0
        type: number
      writing_score:
        maximum: 100
        minimum: 0
        type: number
    required:
    - exam_registration_id
    - status
    type: object
  request.CreateStaffRequestDTO:
    properties:
      cccd:
        type: string
      email:
        maxLength: 150
        type: string
      full_name:
        maxLength: 150
        type: string
      phone:
        maxLength: 20
        type: string
      role_code:
        type: string
    required:
    - cccd
    - email
    - full_name
    - role_code
    type: object
  request.ForceChangePasswordRequestDTO:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      temp_token:
        type: string
    required:
    - new_password
    - temp_token
    type: object
  request.IssueCertificateRequestDTO:
    properties:
      certificate_no:
        maxLength: 30
        type: string
      exam_result_id:
        minimum: 1
        type: integer
      issue_date:
        description: YYYY-MM-DD
        type: string
      verification_code:
        maxLength: 64
        type: string
    required:
    - certificate_no
    - exam_result_id
    - issue_date
    - verification_code
    type: object
  request.ListAuditLogRequestDTO:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      entity_id:
        type: integer
      entity_table:
        type: string
      from:
        description: YYYY-MM-DD
        type: string
      limit:
        type: integer
      page:
        type: integer
      to:
        description: YYYY-MM-DD
        type: string
    type: object
  request.ListCertificatesRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
      from:
        description: YYYY-MM-DD
        type: string
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      status:
        enum:
        - issued
        - revoked
        type: string
      to:
        description: YYYY-MM-DD
        type: string
    type: object
  request.ListDeliveriesRequestDTO:
    properties:
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      status:
        enum:
        - requested
        - shipped
        - delivered
        - failed
        type: string
    type: object
  request.LoginRequestDTO:
    properties:
      identifier:
        description: Can be Email or CCCD
        type: string
      password:
        type: string
    required:
    - identifier
    - password
    type: object
  request.ManualApproveRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      reason:
        maxLength: 500
        minLength: 5
        type: string
    required:
    - evidence_urls
    - reason
    type: object
  request.PayOSWebhookData:
    properties:
      accountNumber:
        type: string
      amount:
        type: integer
      code:
        type: string
      counterAccountBankId:
        type: string
      counterAccountBankName:
        type: string
      counterAccountName:
        type: string
      counterAccountNumber:
        type: string
      currency:
        type: string
      desc:
        type: string
      description:
        type: string
      orderCode:
        type: integer
      paymentLinkId:
        type: string
      reference:
        type: string
      transactionDateTime:
        type: string
      virtualAccountName:
        type: string
      virtualAccountNumber:
        type: string
    type: object
  request.PayOSWebhookPayload:
    properties:
      code:
        type: string
      data:
        $ref: '#/definitions/request.PayOSWebhookData'
      desc:
        type: string
      signature:
        type: string
      success:
        type: boolean
    type: object
  request.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  request.RefundMarkRequestDTO:
    properties:
      evidence_urls:
        items:
          type: string
        minItems: 1
        type: array
      reason:
        maxLength: 500
        minLength: 5
        type: string
    required:
    - evidence_urls
    - reason
    type: object
  request.RegisterRequestDTO:
    properties:
      cccd:
        type: string
      email:
        maxLength: 150
        type: string
      full_name:
        maxLength: 150
        type: string
      password:
        maxLength: 72
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - cccd
    - email
    - full_name
    - password
    - phone
    type: object
  request.ReserveSeatRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
    required:
    - exam_session_id
    type: object
  request.RevokeCertificateRequestDTO:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  request.TransferRegistrationRequestDTO:
    properties:
      new_exam_session_id:
        minimum: 1
        type: integer
    required:
    - new_exam_session_id
    type: object
  request.UpdateAccountRequestDTO:
    properties:
      email:
        maxLength: 150
        type: string
      full_name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
    type: object
  request.UpdatePublicationStatusRequestDTO:
    properties:
      exam_session_publication_status:
        enum:
        - draft
        - published
        - scheduled
        type: string
      exam_session_publish_at:
        type: string
    required:
    - exam_session_publication_status
    type: object
  request.UploadDocumentRequestDTO:
    properties:
      address_detail:
        maxLength: 255
        type: string
      back_image_url:
        type: string
      doc_number:
        maxLength: 30
        type: string
      doc_type:
        enum:
        - cccd
        - passport
        type: string
      front_image_url:
        type: string
      issue_date:
        description: YYYY-MM-DD
        type: string
      issue_place:
        maxLength: 150
        type: string
      portrait_image_url:
        type: string
      ward_id:
        minimum: 1
        type: integer
    required:
    - doc_number
    - doc_type
    - front_image_url
    - issue_date
    - issue_place
    - portrait_image_url
    type: object
  request.ValidatePortraitRequestDTO:
    properties:
      portrait_image_url:
        type: string
    required:
    - portrait_image_url
    type: object
  request.VerifyCertRequestDTO:
    properties:
      certificate_no:
        type: string
      code:
        type: string
      dob:
        description: YYYY-MM-DD — required when certificate_no is used
        type: string
    type: object
  response.DocumentResponseDTO:
    properties:
      address_detail:
        type: string
      back_image_url:
        type: string
      candidate_id:
        type: integer
      doc_number:
        type: string
      doc_type:
        type: string
      front_image_url:
        type: string
      id:
        type: integer
      issue_date:
        type: string
      issue_place:
        type: string
      portrait_image_url:
        type: string
      province_id:
        type: integer
      rejection_reason:
        type: string
      verification_status:
        type: string
      ward_id:
        type: integer
    type: object
  response.PortraitValidationResponseDTO:
    properties:
      brightness:
        type: number
      has_face:
        type: boolean
      has_glasses:
        type: boolean
      is_blurred:
        type: boolean
      is_too_dark:
        type: boolean
      is_white_background:
        type: boolean
      reasons:
        items:
          type: string
        type: array
      rejection_reason:
        type: string
      valid:
        type: boolean
    type: object
  response.UpdatePublicationStatusResponseDTO:
    properties:
      exam_session_publication_status:
        type: string
      exam_session_publish_at:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the backend API for Vinh University HSK Computer-based Test
    Registration System.
  title: Vinh University HSK Computer-based Test Registration System API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      consumes:
      - application/json
      description: Tra cứu lịch sử hoạt động (Audit Logs) của người dùng và admin.
      parameters:
      - description: Dữ liệu yêu cầu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ListAuditLogRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Nhật ký hệ thống (Admin)
      tags:
      - Audit
  /admin/candidates:
    get:
      consumes:
      - application/json
      description: Lọc, phân trang và xem danh sách toàn bộ thí sinh trên hệ thống.
      parameters:
      - description: Dữ liệu yêu cầu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AdminListCandidatesRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách thí sinh (Admin)
      tags:
      - Candidate
  /admin/candidates/:id/approve:
    post:
      consumes:
      - application/json
      description: Admin phê duyệt giấy tờ tùy thân của thí sinh.
      parameters:
      - description: ID tham số định danh
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Duyệt giấy tờ
      tags:
      - Candidate
  /admin/candidates/clear-cache:
    post:
      description: Xoá toàn bộ cache hồ sơ và giấy tờ thí sinh trên Redis để phục
        vụ FE/Admin làm mới dữ liệu
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Xoá toàn bộ bộ nhớ đệm thí sinh (Admin)
      tags:
      - Candidate
  /admin/candidates/duplicates:
    get:
      consumes:
      - application/json
      description: Endpoint for AdminListDuplicates
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: AdminListDuplicates
      tags:
      - Candidate
  /admin/candidates/export:
    get:
      description: Xuất danh sách hồ sơ phù hợp với bộ lọc thành tệp PDF.
      parameters:
      - description: 'Trạng thái giấy tờ: all, pending, verified, rejected (mặc định
          all)'
        in: query
        name: status
        type: string
      - description: Cấp độ HSK
        in: query
        name: level
        type: string
      - description: Tìm theo họ tên hoặc CCCD
        in: query
        name: search
        type: string
      - description: Ngày thi của đợt thi, định dạng YYYY-MM-DD
        in: query
        name: exam_date
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: Tệp PDF
          schema:
            type: file
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Xuất danh sách thí sinh (Admin)
      tags:
      - Candidate
  /admin/candidates/metrics:
    get:
      description: Trả về tổng số hồ sơ và số lượng theo trạng thái giấy tờ mới nhất.
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Thống kê hồ sơ thí sinh (Admin)
      tags:
      - Candidate
  /admin/certificates:
    get:
      consumes:
      - application/json
      description: Admin xem toàn bộ chứng chỉ trên hệ thống.
      parameters:
      - description: Dữ liệu yêu cầu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ListCertificatesRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách chứng chỉ (Admin)
      tags:
      - Certificate
  /admin/certificates/:id/revoke:
    post:
      consumes:
      - application/json
      description: Vô hiệu hóa một chứng chỉ do sai sót hoặc vi phạm.
      parameters:
      - description: ID tham số định danh
        in: path
        name: id
        required: true
        type: integer
      - description: Dữ liệu yêu cầu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RevokeCertificateRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
