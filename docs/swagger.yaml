        `CCCD_EXTRACTED`; có thể tra cứu lại qua `GET /cccd/jobs/{id}`. Truyền `?sync=true`
        để chờ kết quả trực tiếp (có thể vượt quá WriteTimeout của server với ảnh
        khó).
      parameters:
      - description: Ảnh mặt trước hoặc mặt sau CCCD/CMND
        in: formData
        name: image
        required: true
        type: file
      - description: Chờ kết quả đồng bộ (mặc định false)
        in: query
        name: sync
        type: boolean
      - description: Mã định danh tác vụ do client tự sinh (tùy chọn)
        in: header
        name: X-Request-ID
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kết quả trích xuất đồng bộ (khi sync=true)
          schema:
