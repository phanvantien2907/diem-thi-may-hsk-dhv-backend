basePath: /api/v1
definitions:
  request.AdminListCandidatesRequestDTO:
    properties:
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      status:
        enum:
        - pending
        - verified
        - rejected
        type: string
    type: object
  request.AdminUpdateDeliveryRequestDTO:
    properties:
      courier:
        maxLength: 50
        type: string
      tracking_no:
        maxLength: 50
        type: string
    required:
    - courier
    - tracking_no
    type: object
  request.BatchIssueRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
      issue_date:
        description: YYYY-MM-DD
        type: string
    required:
    - exam_session_id
    - issue_date
    type: object
  request.ChangePasswordRequestDTO:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.CreateDeliveryRequestDTO:
    properties:
      address_detail:
        maxLength: 255
        type: string
      courier:
        maxLength: 50
        type: string
      ward_id:
        minimum: 1
        type: integer
    required:
    - address_detail
    type: object
  request.CreatePaymentRequestDTO:
    properties:
      amount:
        minimum: 1
        type: integer
      exam_registration_id:
        minimum: 1
        type: integer
      method:
        enum:
        - vnpay
        - momo
        - zalopay
        - bank_transfer
        - cash
        type: string
    required:
    - amount
    - exam_registration_id
    - method
    type: object
  request.CreateProfileRequestDTO:
    properties:
      chinese_study_years:
        minimum: 0
        type: integer
      dob:
        description: YYYY-MM-DD
        type: string
      ethnicity:
        maxLength: 50
        type: string
      full_name:
        maxLength: 150
        type: string
      full_name_cn:
        maxLength: 150
        type: string
      gender:
        enum:
        - male
        - female
        - other
        type: string
      nationality:
        maxLength: 50
        type: string
      religion:
        maxLength: 50
        type: string
    required:
    - dob
    - full_name
    - gender
    type: object
  request.CreateResultRequestDTO:
    properties:
      exam_registration_id:
        minimum: 1
        type: integer
      listening_score:
        maximum: 100
        minimum: 0
        type: number
      reading_score:
        maximum: 100
        minimum: 0
        type: number
      status:
        enum:
        - pass
        - fail
        type: string
      total_score:
        minimum: 0
        type: number
      writing_score:
        maximum: 100
        minimum: 0
        type: number
    required:
    - exam_registration_id
    - status
    type: object
  request.CreateStaffRequestDTO:
    properties:
      email:
        maxLength: 150
        type: string
      phone:
        maxLength: 20
        type: string
      role_code:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - role_code
    - username
    type: object
  request.ForceChangePasswordRequestDTO:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      temp_token:
        type: string
    required:
    - new_password
    - temp_token
    type: object
  request.IssueCertificateRequestDTO:
    properties:
      certificate_no:
        maxLength: 30
        type: string
      exam_result_id:
        minimum: 1
        type: integer
      issue_date:
        description: YYYY-MM-DD
        type: string
      verification_code:
        maxLength: 64
        type: string
    required:
    - certificate_no
    - exam_result_id
    - issue_date
    - verification_code
    type: object
  request.ListAuditLogRequestDTO:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      entity_id:
        type: integer
      entity_table:
        type: string
      from:
        description: YYYY-MM-DD
        type: string
      limit:
        type: integer
      page:
        type: integer
      to:
        description: YYYY-MM-DD
        type: string
    type: object
  request.ListCertificatesRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
      from:
        description: YYYY-MM-DD
        type: string
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      status:
        enum:
        - issued
        - revoked
        type: string
      to:
        description: YYYY-MM-DD
        type: string
    type: object
  request.ListDeliveriesRequestDTO:
    properties:
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      status:
        enum:
        - requested
        - shipped
        - delivered
        - failed
        type: string
    type: object
  request.LoginRequestDTO:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.PaymentCallbackRequestDTO:
    properties:
      status:
        enum:
        - pending
        - success
        - failed
        - refunded
        type: string
      transaction_ref:
        type: string
    required:
    - status
    - transaction_ref
    type: object
  request.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  request.RegisterRequestDTO:
    properties:
      email:
        maxLength: 150
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - password
    - phone
    type: object
  request.ReserveSeatRequestDTO:
    properties:
      exam_session_id:
        minimum: 1
        type: integer
    required:
    - exam_session_id
    type: object
  request.RevokeCertificateRequestDTO:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  request.TransferRegistrationRequestDTO:
    properties:
      new_exam_session_id:
        minimum: 1
        type: integer
    required:
    - new_exam_session_id
    type: object
  request.UpdateAccountRequestDTO:
    properties:
      email:
        maxLength: 150
        type: string
      phone:
        maxLength: 20
        type: string
    type: object
  request.VerifyCertRequestDTO:
    properties:
      certificate_no:
        type: string
      code:
        type: string
      dob:
        description: YYYY-MM-DD — required when certificate_no is used
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the backend API for Vinh University HSK Computer-based Test
    Registration System.
  title: Vinh University HSK Computer-based Test Registration System API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      consumes:
      - application/json
      description: Tra cứu lịch sử hoạt động (Audit Logs) của người dùng và admin.
      parameters:
      - description: Dữ liệu yêu cầu
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ListAuditLogRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dữ liệu yêu cầu không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Chưa xác thực (Thiếu token hoặc token hết hạn)
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Không có quyền truy cập
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Nhật ký hệ thống (Admin)
      tags:
      - Audit
  /admin/candidates:
