      description: Tiếp nhận ảnh CCCD mặt trước/mặt sau qua multipart/form-data. Kiểm
        tra magic-byte (512 bytes đầu + image.DecodeConfig), xử lý hoàn toàn trong
        RAM (không ghi xuống đĩa theo Nghị định 13/2023/NĐ-CP), tạo task_id và trả
        về 202 Accepted ngay lập tức. Kết quả trích xuất dạng chữ (không có sinh trắc
        học/khuôn mặt) được đẩy qua WebSocket.
