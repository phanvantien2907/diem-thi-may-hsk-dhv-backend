version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hsk_vinh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       ${DB_NAME:-hsk_vinh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hsk_vinh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hsk_net

  # ── Migrate ──────────────────────────────────────────────────────────────
  migrate:
    image: migrate/migrate:v4.17.0
    container_name: hsk_vinh_migrate
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-hsk_vinh}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hsk_net

  # ── Go API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hsk_vinh_api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-hsk_vinh}?sslmode=disable
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - hsk_net

  # ── Adminer (DB GUI) ─────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: hsk_vinh_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: 
      - hsk_net

  # ── Ngrok Tunnel (Webhook Testing) ───────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: hsk_vinh_ngrok
    restart: unless-stopped
    command: http http://api:8080 --url=${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - api
    networks:
      - hsk_net

  # ── Redis (commented out – uncomment when caching / queue is needed) ─────
  # redis:
  #   image: redis:7-alpine
  #   container_name: hsk_vinh_redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - hsk_net

volumes:
  postgres_data:
    driver: local
  # redis_data:
  #   driver: local

networks:
  hsk_net:
    driver: bridge
